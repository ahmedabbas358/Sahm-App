name: sahm_mobile
description: "سهم — منصة إدارة الشهادات الجامعية"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Network
  dio: ^5.5.0+1

  # Local Database
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24

  # Serialization
  freezed_annotation: ^2.4.3
  json_annotation: ^4.9.0

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  gap: ^3.0.1
  shimmer: ^3.0.0

  # Camera & Images
  camera: ^0.11.0+2
  image_picker: ^1.1.2

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.1

  # Connectivity
  connectivity_plus: ^6.0.3

  # Utils
  intl: ">=0.19.0 <1.0.0"
  uuid: ^4.4.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  drift_dev: ^2.18.0
  mockito: ^5.4.4
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # Fonts loaded at runtime via google_fonts package (IBMPlexSansArabic)
  # See: lib/core/theme/app_theme.dart

