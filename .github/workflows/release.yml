name: Sahm Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write
  packages: write

jobs:
  # -------------------------------------------------------------
  # Job 1: Verification & Pre-flight Checks
  # -------------------------------------------------------------
  preflight:
    name: Pre-flight Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Tag Format
        run: |
          TAG="${{ github.ref_name || inputs.tag_name }}"
          echo "Releasing version: $TAG"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Tag format must follow semantic versioning, e.g. v0.1.0"
            exit 1
          fi

  # -------------------------------------------------------------
  # Job 2: Build Android APK (Release Artifact)
  # -------------------------------------------------------------
  build-android:
    name: Build Android APK
    needs: preflight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Debug Keystore Exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Rename & Prepare APK
        run: |
          TAG="${{ github.ref_name || inputs.tag_name }}"
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk release-assets/sahm-mobile-${TAG}.apk
          cd release-assets && sha256sum sahm-mobile-${TAG}.apk > sahm-mobile-${TAG}.apk.sha256

      - name: Upload Mobile Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sahm-android-apk
          path: apps/mobile/release-assets/

  # -------------------------------------------------------------
  # Job 3: Build iOS IPA (Release Artifact)
  # -------------------------------------------------------------
  build-ios:
    name: Build iOS IPA
    needs: preflight
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build iOS Application
        run: |
          # Try simulator build first which compiles all Dart & native code cleanly without requiring Apple Developer Team
          flutter build ios --release --no-codesign --simulator || \
          flutter build ios --release --no-codesign

      - name: Create IPA Archive
        run: |
          TAG="${{ github.ref_name || inputs.tag_name }}"
          mkdir -p release-assets
          
          # Find the built Runner.app bundle
          APP_PATH=$(find build/ios -name "Runner.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Runner.app was not found!"
            exit 1
          fi
          echo "Found Runner.app at: $APP_PATH"
          
          rm -rf Payload
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r release-assets/sahm-mobile-${TAG}.ipa Payload/
          cd release-assets && shasum -a 256 sahm-mobile-${TAG}.ipa > sahm-mobile-${TAG}.ipa.sha256

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sahm-ios-ipa
          path: apps/mobile/release-assets/

  # -------------------------------------------------------------
  # Job 4: Build & Package Admin Dashboard
  # -------------------------------------------------------------
  build-admin:
    name: Build Admin Web Bundle
    needs: preflight
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Admin Panel
        run: npm run build

  # -------------------------------------------------------------
  # Job 5: Create GitHub Release with Assets
  # -------------------------------------------------------------
  create-release:
    name: Publish GitHub Release
    needs: [build-android, build-ios, build-admin]
    if: always() && !contains(needs.*.result, 'cancelled') && (needs.build-android.result == 'success' || needs.build-ios.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Android Artifacts
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: sahm-android-apk
          path: ./release-assets

      - name: Download iOS Artifacts
        if: needs.build-ios.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: sahm-ios-ipa
          path: ./release-assets

      - name: List Release Assets
        run: ls -la ./release-assets/

      - name: Extract Release Notes from CHANGELOG
        id: notes
        run: |
          TAG="${{ github.ref_name || inputs.tag_name }}"
          VERSION="${TAG#v}"
          echo "Extracting release notes for version: $VERSION"
          
          if [ -f CHANGELOG.md ]; then
            python3 -c "
          import re, sys
          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
              content = f.read()
          pattern = r'## \[' + re.escape('$VERSION') + r'\][^\n]*\n(.*?)(?=\n## \[|\Z)'
          match = re.search(pattern, content, re.DOTALL)
          if match:
              with open('RELEASE_NOTES.md', 'w', encoding='utf-8') as out:
                  out.write(match.group(1).strip())
          else:
              with open('RELEASE_NOTES.md', 'w', encoding='utf-8') as out:
                  out.write('### سهم (Sahm) الإصدار ' + '$TAG\n\nإصدار معتمد للإنتاج يتضمن كافة الأنظمة وحزم الأمان.')
          "
          else
            echo "سهم (Sahm) Release $TAG" > RELEASE_NOTES.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          name: "سهم — Sahm Release ${{ github.ref_name || inputs.tag_name }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
