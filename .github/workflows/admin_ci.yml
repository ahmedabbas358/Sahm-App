name: Admin CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/admin/**'
      - '.github/workflows/admin_ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/admin/**'

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Type check
        run: npm run type-check || true

      - name: Lint
        run: npm run lint || true

      - name: Build
        run: npm run build
